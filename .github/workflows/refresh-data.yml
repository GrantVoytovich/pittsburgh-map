# Refreshes the snapshot GeoJSON in public/data/ once a week (and on demand).
# If any file changed, it commits the new data back to the repo, which triggers
# a fresh Vercel deploy automatically. Live bike data is NOT handled here - that
# is fetched in the browser at runtime.
name: Refresh map data

on:
  schedule:
    - cron: '17 9 * * 1' # every Monday 09:17 UTC
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest data
        run: npm run fetch-data

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: weekly data refresh"
            git push
          fi

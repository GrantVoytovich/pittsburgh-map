<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="description" content="One map of Pittsburgh with parking, bathrooms, bike share, water fountains, EV chargers and gas around any destination." />
    <meta name="theme-color" content="#fbfaf7" />
    <title>Pittsburgh Everything Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map" role="application" aria-label="Map of Pittsburgh"></div>

    <aside id="panel" class="panel" aria-label="Controls and results">
      <div class="panel__handle" aria-hidden="true"></div>

      <header class="brand">
        <span class="brand__mark" id="brand-mark" aria-hidden="true"></span>
        <div class="brand__text">
          <h1>Pittsburgh <em>Everything</em> Map</h1>
          <p class="tagline">Everything you need around any destination.</p>
        </div>
      </header>

      <form id="search-form" role="search" class="search">
        <label class="sr-only" for="search">Search for a place or a need</label>
        <div class="search__field">
          <span class="search__icon" id="search-icon" aria-hidden="true"></span>
          <input id="search" name="search" type="search" autocomplete="off" placeholder="parking near PNC Park" />
          <button type="submit" class="btn btn--go">Go</button>
        </div>
        <div class="chips" id="example-chips" aria-label="Example searches">
          <button type="button" class="chip" data-q="parking near PNC Park">parking · PNC Park</button>
          <button type="button" class="chip" data-q="bathroom near Market Square">bathroom · Market Square</button>
          <button type="button" class="chip" data-q="bike near Strip District">bike · Strip District</button>
          <button type="button" class="chip" data-q="cheapest parking near Downtown">cheapest parking</button>
          <button type="button" class="chip" data-q="gas near Oakland">gas · Oakland</button>
        </div>
      </form>

      <div class="panel__scroll">
        <section class="section layers" aria-label="Map layers">
          <div class="section__head">
            <h2>Layers</h2>
            <span class="section__hint">tap to toggle</span>
          </div>
          <div id="legend" class="legend"></div>
        </section>

        <section class="section results" aria-live="polite">
          <div class="section__head">
            <h2 id="results-title">Nearest to Downtown</h2>
          </div>
          <div id="results" class="results__list"></div>
        </section>
      </div>

      <footer class="panel__footer">
        <button type="button" id="sources-btn" class="btn btn--ghost">
          <span class="btn__icon" id="sources-icon" aria-hidden="true"></span>
          Data sources &amp; freshness
        </button>
      </footer>
    </aside>

    <dialog id="sources-dialog" class="dialog" aria-label="Data sources">
      <div class="dialog__head">
        <h2>Where this data comes from</h2>
        <button type="button" class="btn btn--close" data-close aria-label="Close">&times;</button>
      </div>
      <div id="sources-body" class="dialog__body"></div>
      <p class="dialog__note">
        Live data is labelled "live". Everything else is a snapshot refreshed weekly and may be out of date.
      </p>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
